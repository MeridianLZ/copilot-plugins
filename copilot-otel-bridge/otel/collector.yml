receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 500ms
    send_batch_size: 256

exporters:
  file/traces:
    path: /native-otel/traces.jsonl
    format: json
    create_directory: true
    directory_permissions: "0700"
    rotation:
      max_megabytes: 25
      max_days: 7
      max_backups: 10
      localtime: false
  file/metrics:
    path: /native-otel/metrics.jsonl
    format: json
    create_directory: true
    directory_permissions: "0700"
    rotation:
      max_megabytes: 25
      max_days: 7
      max_backups: 10
      localtime: false
  file/logs:
    path: /native-otel/logs.jsonl
    format: json
    create_directory: true
    directory_permissions: "0700"
    rotation:
      max_megabytes: 25
      max_days: 7
      max_backups: 10
      localtime: false

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/metrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/logs]
