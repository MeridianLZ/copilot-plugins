<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copilot OTel Bridge · Conversations</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2129;--panel3:#21262d;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--ok:#3fb950;--err:#f85149;--warn:#d29922;--violet:#bc8cff;--cyan:#39c5cf;--user:#1f6feb}
*{box-sizing:border-box;margin:0}body{height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.mono,code,pre{font-family:ui-monospace,"Cascadia Code",Consolas,monospace}
#app{display:flex;height:100vh}.sidebar{width:350px;min-width:300px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.brand{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}.brand h1{font-size:14px;flex:1}.health{width:9px;height:9px;border-radius:50%;background:var(--err)}.health.up{background:var(--ok);box-shadow:0 0 9px var(--ok)}
.muted{color:var(--muted)}.tiny{font-size:11px}.filters{padding:12px;border-bottom:1px solid var(--border);display:grid;gap:8px}.filter-row{display:flex;gap:7px}.field{min-width:0;flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 8px;outline:0}.field:focus{border-color:var(--accent);box-shadow:0 0 0 2px #1f6feb44}.check{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}.check input{accent-color:var(--accent)}
#session-list{overflow:auto;flex:1}.session-item{padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;outline:0}.session-item:hover,.session-item:focus{background:var(--panel2)}.session-item.active{background:#1b2735;border-left:3px solid var(--accent);padding-left:11px}.session-top{display:flex;gap:7px;align-items:center}.session-id{font-weight:600;font-size:12px;flex:1}.when{font-size:11px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}.dot.error{background:var(--err)}.dot.open{background:var(--ok);animation:pulse 1.5s infinite}@keyframes pulse{50%{opacity:.35}}.badges{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 0 15px}.badge,.chip{border:1px solid var(--border);background:var(--panel2);border-radius:999px;color:var(--muted);font-size:10px;padding:1px 7px}.badge.err,.chip.err{color:var(--err);border-color:#f8514988}.badge.ok{color:var(--ok);border-color:#3fb95088}.empty{padding:30px 16px;text-align:center;color:var(--muted)}
#main{min-width:0;flex:1;display:flex;flex-direction:column}.placeholder{margin:auto;text-align:center;color:var(--muted)}.placeholder strong{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.topbar{display:none;padding:11px 18px;border-bottom:1px solid var(--border);background:var(--panel);align-items:center;gap:9px;flex-wrap:wrap}.topbar.show{display:flex}.topbar h2{font-size:14px;max-width:290px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.topmeta{color:var(--muted);font-size:11px}.top-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}.action{border:1px solid var(--border);background:var(--panel2);border-radius:6px;padding:5px 8px;font-size:11px}.action:hover{border-color:var(--accent);color:var(--accent)}.status{font-size:10px;padding:1px 7px;border:1px solid;border-radius:999px}.status.ok{color:var(--ok);border-color:var(--ok)}.status.error{color:var(--err);border-color:var(--err)}.status.open{color:var(--ok);border-color:var(--ok)}.status.recovered{color:var(--warn);border-color:var(--warn)}
#scroller{display:none;overflow:auto;flex:1}.scroller-show{display:block!important}.waterfall{margin:14px 18px 0;border:1px solid var(--border);border-radius:8px;background:var(--panel);overflow:hidden}.collapse{width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.collapse:hover{color:var(--text)}.collapse:after{content:"⌄";float:right;font-size:15px}.collapse.closed:after{content:"›"}.wf{padding:8px 12px 12px;border-top:1px solid var(--border)}.wf.closed{display:none}.wf-row{display:flex;align-items:center;gap:8px;height:21px}.wf-label{width:210px;min-width:100px;text-align:right;color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wf-track{position:relative;flex:1;height:11px;background:var(--bg);border-radius:3px}.wf-bar{position:absolute;top:1px;height:9px;min-width:3px;border-radius:3px}.wf-bar.session{background:var(--accent)}.wf-bar.turn{background:var(--user)}.wf-bar.tool{background:var(--cyan)}.wf-bar.subagent{background:var(--violet)}.wf-bar.error{background:var(--err)}.wf-dur{width:68px;color:var(--muted);font-size:10px}
#feed-wrap{max-width:1050px;padding:18px 24px 60px}.feed-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}.session-shell{border-left:2px solid var(--accent);padding-left:15px}.turn-node{border-left:2px solid var(--user);padding-left:14px;margin:12px 0}.turn-head,.node-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.node-title{font-weight:650}.node-time{color:var(--muted);font-size:10.5px;margin-left:auto}.node-meta{color:var(--muted);font-size:11px}.nested{margin:8px 0 8px 16px;padding-left:13px;border-left:1px solid #30363d}.tool-node{border-left:2px solid var(--cyan);padding:8px 11px;margin:8px 0;background:linear-gradient(90deg,#11252b66,transparent);border-radius:0 7px 7px 0}.tool-node.failed{border-left-color:var(--err);background:linear-gradient(90deg,#3b171766,transparent)}.subagent-node{border-left:2px solid var(--violet);padding:8px 11px;margin:8px 0;background:linear-gradient(90deg,#27173d66,transparent);border-radius:0 7px 7px 0}.tool-events{margin-top:7px;display:grid;gap:5px}.event-line{font-size:11px;color:var(--muted);padding:4px 7px;border-left:1px solid var(--border)}.event-line.error{color:var(--err);border-color:var(--err)}.event-line .event-name{color:var(--text);font-weight:600}.turn-prompt{margin:8px 0 10px;display:flex}.bubble{max-width:min(820px,90%);padding:10px 13px;border:1px solid #1f4472;background:#14283f;border-radius:10px 10px 10px 3px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble-label{font-size:10.5px;color:var(--muted);margin-bottom:4px}.agent-stop{margin:8px 0;color:var(--muted);font-size:11px}.agent-stop strong{color:var(--text)}.sys-divider{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:11px;margin:14px 0}.sys-divider:before,.sys-divider:after{content:"";height:1px;background:var(--border);flex:1}.notice{display:inline-block;margin:5px 0;padding:5px 9px;border:1px solid #d2992266;background:#3d2e1022;color:var(--warn);border-radius:6px;font-size:11px}.error-block{margin:7px 0;padding:8px 10px;border-left:2px solid var(--err);background:#3b171744;color:var(--err);border-radius:0 6px 6px 0}
.chip{display:inline-block;margin:2px 2px}.chip.hash{border-style:dashed}.payload{margin-top:6px}.plain{white-space:pre-wrap;overflow-wrap:anywhere}
.code-wrap{position:relative;margin:7px 0;border:1px solid var(--border);border-radius:7px;background:#0b1016;overflow:hidden;--code-size:12px}.code-toolbar{position:absolute;right:6px;top:5px;z-index:1;display:flex;gap:3px;opacity:0;transition:opacity .15s}.code-wrap:hover .code-toolbar,.code-wrap:focus-within .code-toolbar{opacity:1}.code-btn{border:1px solid var(--border);background:#21262ddd;color:var(--muted);border-radius:4px;padding:2px 5px;font-size:10px}.code-btn:hover{color:var(--text);border-color:var(--accent)}.code-pre{overflow:auto;padding:9px 10px;font-size:var(--code-size);line-height:1.55;color:#d2e2f0}.code-line{display:flex;min-height:1.55em}.line-no{width:34px;min-width:34px;padding-right:10px;text-align:right;color:#536170;user-select:none}.no-lines .line-no{display:none}.code-text{white-space:pre}.copy-note{position:absolute;right:6px;bottom:5px;background:var(--ok);color:#07130a;border-radius:4px;padding:2px 6px;font-size:10px;opacity:0;transition:opacity .15s}.copy-note.show{opacity:1}
.turn-prompt.agent{justify-content:flex-end}.bubble.agent{border-color:#2ea04366;background:#132a1a;border-radius:10px 10px 3px 10px}.model-chip{border:1px solid #2ea04366;color:var(--ok);border-radius:999px;font-size:10px;padding:1px 7px}.reasoning{margin:6px 0;border-left:2px solid var(--warn);background:#3d2e1018;border-radius:0 6px 6px 0}.reasoning summary{cursor:pointer;padding:5px 9px;color:var(--warn);font-size:11px;user-select:none}.reasoning-body{padding:2px 10px 8px;color:#c9b28a;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.perm-row{display:flex;align-items:baseline;gap:8px;margin:6px 0;padding:5px 9px;border:1px dashed var(--border);border-radius:6px;font-size:11px;color:var(--muted)}.perm-row .status{margin-left:auto}.child-link{border:1px solid var(--violet);background:transparent;color:var(--violet);border-radius:6px;padding:2px 8px;font-size:10px}.child-link:hover{background:#27173d66}.usage-footer{margin:18px 0 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--muted);font-size:11px;display:flex;gap:16px;flex-wrap:wrap}.tool-req{border:1px solid #39c5cf66;color:var(--cyan);border-radius:999px;font-size:10px;padding:1px 7px;margin:2px 2px;display:inline-block}.md p{margin:4px 0}.md strong{color:var(--text)}
@media(max-width:760px){.sidebar{width:290px;min-width:250px}.top-actions{margin-left:0}.wf-label{width:110px}.feed-wrap{padding-left:14px;padding-right:14px}}
@media print{body{height:auto;overflow:visible;background:white;color:#111}.sidebar,.top-actions,.live-control,.waterfall,.feed-title{display:none!important}#main,#scroller{display:block!important;overflow:visible}.topbar{display:flex!important;background:white;border-color:#ddd}.topbar h2,.topmeta,.node-meta,.node-time,.muted{color:#555}.session-shell,.turn-node,.nested{border-color:#888}.tool-node,.subagent-node,.bubble{background:white!important;border-color:#888}.code-wrap{background:#f4f4f4;border-color:#bbb}.code-text{color:#111}.line-no{color:#777}.code-toolbar{display:none}}
</style>
</head>
<body>
<div id="app">
<aside class="sidebar">
  <div class="brand"><span class="health" id="health" title="Bridge health"></span><h1>Copilot OTel Bridge</h1><span class="tiny muted" id="refresh-ts"></span></div>
  <div class="filters">
    <input class="field" id="search" placeholder="Search session id or cwd" aria-label="Search sessions">
    <div class="filter-row"><select class="field" id="status-filter" aria-label="Filter status"><option value="all">All statuses</option><option value="ok">OK</option><option value="error">Error</option><option value="open">Open</option></select><select class="field" id="sort" aria-label="Sort sessions"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="longest">Longest</option><option value="tools">Most tools</option><option value="errors">Most errors</option></select></div>
    <div class="filter-row"><input class="field" id="min-tools" type="number" min="0" placeholder="Min tools" aria-label="Minimum tools"><label class="check"><input id="has-errors" type="checkbox"> has errors</label></div>
  </div>
  <div id="session-list"><div class="empty">No sessions yet.<br>Run <code>copilot</code> with hooks installed.</div></div>
</aside>
<main id="main">
  <div class="placeholder" id="placeholder"><strong>Select a conversation</strong><span>Sessions appear as hook events arrive on the ledger.</span></div>
  <header class="topbar" id="topbar">
    <h2 class="mono" id="head-sid"></h2><span class="status" id="head-status"></span><span class="topmeta" id="head-range"></span><span class="topmeta mono" id="head-cwd"></span>
    <label class="check live-control"><input type="checkbox" id="live" checked> live</label>
    <div class="top-actions"><button class="action" data-export="copy">Copy conversation</button><button class="action" data-export="md">Export Markdown</button><button class="action" data-export="json">Export JSON</button><button class="action" data-export="pdf">Export PDF</button></div>
  </header>
  <div id="scroller"><section class="waterfall"><button class="collapse" id="wf-toggle">Span waterfall</button><div class="wf" id="wf"></div></section><section id="feed-wrap"><div class="feed-title">Conversation timeline · verbatim chronological trace</div><div id="feed"></div></section></div>
</main>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);let selected=null,lastJson="",trace=null,sessions=[],codeSeq=0,codeStore=new Map();
const esc=v=>{const d=document.createElement("div");d.textContent=String(v??"");return d.innerHTML};
const val=(p,...keys)=>{for(const k of keys)if(p&&p[k]!==undefined)return p[k];return undefined};
const timeOf=e=>Date.parse(e.payload?.timestamp||"")||e.observed_at_unix_ms||0;
const fmtTime=ms=>new Date(ms).toLocaleTimeString([],{hour12:false});
const fmtDate=ms=>new Date(ms).toLocaleString();
function dur(ms){if(ms==null||Number.isNaN(ms))return"";if(ms<1000)return Math.round(ms)+" ms";if(ms<60000)return(ms/1000).toFixed(1)+" s";return Math.floor(ms/60000)+"m "+Math.round(ms%60000/1000)+"s"}
function short(id){return id.length>18?id.slice(0,10)+"…"+id.slice(-5):id}
function isRedacted(v){return v&&typeof v==="object"&&!Array.isArray(v)&&v.redacted===true}
function hashChip(v){if(!isRedacted(v))return"";return`<span class="chip hash mono">redacted · ${v.sha256?`sha256:${esc(String(v.sha256).slice(0,16))}…`:"hash unavailable"} · ${esc(v.bytes??"?")} B</span>`}
function primitive(v){return v===null||typeof v!=="object"}
function codeHtml(raw){const text=typeof raw==="string"?raw:JSON.stringify(raw,null,2);if(text==null)return"";const id="c"+(++codeSeq);codeStore.set(id,text);const lines=text.split("\n");return`<div class="code-wrap" data-code-id="${id}" tabindex="0"><div class="code-toolbar"><button class="code-btn" data-code-action="copy">Copy</button><button class="code-btn" data-code-action="lines">№</button><button class="code-btn" data-code-action="smaller">Aa−</button><button class="code-btn" data-code-action="larger">Aa+</button></div><pre class="code-pre">${lines.map((l,i)=>`<span class="code-line"><span class="line-no">${i+1}</span><span class="code-text">${esc(l)||" "}</span></span>`).join("")}</pre><span class="copy-note">Copied</span></div>`}
function content(v,forceCode=false){if(v===undefined||v===null)return"";if(isRedacted(v))return hashChip(v);if(typeof v==="string"){if(forceCode||v.includes("\n")||/^\s*(\{|\[|#|SELECT |curl |npm |pnpm |git |docker |kubectl |dotnet )/i.test(v))return codeHtml(v);return`<span class="plain">${esc(v)}</span>`}if(typeof v==="object")return codeHtml(v);return esc(v)}
function md(text){const parts=String(text).split(/```(\w*)\n?/);let html="",i=0;while(i<parts.length){if(i%2===0){const seg=parts[i];html+=esc(seg).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>").split(/\n{2,}/).map(p=>p.trim()?`<p>${p.replace(/\n/g,"<br>")}</p>`:"").join("")}else{const body=parts[i+1]??"";html+=codeHtml(body.replace(/\n$/,""));i+=1}i+=1}return`<div class="md">${html}</div>`}
function contentItems(items,opts={}){return(items||[]).map(c=>{if(c.redacted)return`<span class="chip hash mono">redacted · ${c.redacted.sha256?`sha256:${esc(String(c.redacted.sha256).slice(0,16))}…`:"hash"} · ${esc(c.redacted.bytes??"?")} B</span>`;if(c.label==="reasoning")return`<details class="reasoning"><summary>💭 reasoning</summary><div class="reasoning-body">${esc(c.text)}</div></details>`;if(c.label==="tool_request")return`<span class="tool-req">⚙ ${esc(c.text)}</span>`;if(c.role==="meta")return`<span class="chip">${esc(c.label)}: ${esc(c.text??"")}</span>`;if(c.text!==undefined)return opts.plain?`<span class="plain">${esc(c.text)}</span>`:md(c.text);if(c.json!==undefined)return`<div class="payload"><span class="tiny muted">${esc(c.label)}</span>${codeHtml(c.json)}</div>`;return""}).join("")}
function nodeTime(n){return`<span class="node-time">${fmtTime(n.timestamp_ms)}</span>`}
function renderDocNode(n){
  const kids=()=>(n.children||[]).map(renderDocNode).join("");
  if(n.kind==="session")return`<div class="session-shell">${contentItems(n.content,{plain:true})}${kids()}</div>`;
  if(n.kind==="turn")return`<section class="turn-node"><div class="turn-head"><span class="node-title">Turn</span>${n.status?`<span class="status ${esc(n.status)}">${esc(n.status)}</span>`:""}<span class="node-meta">${n.duration_ms!=null?dur(n.duration_ms):"open"} · ${fmtTime(n.timestamp_ms)}</span></div>${contentItems(n.content)}${kids()}</section>`;
  if(n.kind==="tool")return`<article class="tool-node ${n.status==="error"?"failed":""}"><div class="node-head"><span class="node-title">⚙ <span class="mono">${esc(n.tool_name||n.title)}</span></span>${n.status?`<span class="status ${esc(n.status)}">${esc(n.status)}</span>`:""}${n.heuristic?'<span class="chip">FIFO heuristic</span>':""}<span class="node-meta">${n.duration_ms!=null?dur(n.duration_ms):"running"} · ${fmtTime(n.timestamp_ms)}</span></div>${contentItems(n.content)}${kids()}</article>`;
  if(n.kind==="subagent")return`<article class="subagent-node"><div class="node-head"><span class="node-title">🤖 <span class="mono">${esc(n.agent_name||n.title)}</span></span>${n.status?`<span class="status ${esc(n.status)}">${esc(n.status)}</span>`:""}${n.model?`<span class="model-chip">${esc(n.model)}</span>`:""}${n.child_session_id?`<button class="child-link" data-child-session="${esc(n.child_session_id)}">open child session ↗</button>`:""}<span class="node-meta">${n.duration_ms!=null?dur(n.duration_ms):"running"} · ${fmtTime(n.timestamp_ms)}</span></div>${contentItems(n.content,{plain:true})}${kids()}</article>`;
  // event nodes
  const name=n.event_name||"";const id=String(n.id||"");
  if(id.startsWith("native-user")||name==="userPromptSubmitted")return`<div class="turn-prompt"><div><div class="bubble-label">user · ${fmtTime(n.timestamp_ms)}</div><div class="bubble">${contentItems(n.content)}</div></div></div>`;
  if(id.startsWith("native-msg"))return`<div class="turn-prompt agent"><div><div class="bubble-label" style="text-align:right">assistant${n.model?` · <span class="model-chip">${esc(n.model)}</span>`:""}${n.reasoning_encrypted?' · <span class="chip hash">reasoning encrypted</span>':""} · ${fmtTime(n.timestamp_ms)}</div><div class="bubble agent">${contentItems(n.content)}</div></div></div>`;
  if(id.startsWith("native-permission")||name==="permissionRequest")return`<div class="perm-row">🔐 <strong>${esc(n.title)}</strong>${contentItems(n.content,{plain:true})}${n.status?`<span class="status ${esc(n.status)}">${n.status==="ok"?"approved":"denied"}</span>`:""}${nodeTime(n)}</div>`;
  if(id.startsWith("native-model"))return`<div class="sys-divider"><span>${esc(n.title)} ${nodeTime(n)}</span></div>`;
  if(name==="sessionStart"||name==="sessionEnd")return`<div class="sys-divider"><span>${esc(n.title)}${n.status?` · ${esc(n.status)}`:""} ${nodeTime(n)}</span></div>`;
  if(name==="preCompact")return`<div class="sys-divider"><span>Context compacted ${nodeTime(n)}</span></div>`;
  if(name==="notification")return`<div class="notice">🔔 ${esc(n.title)} ${contentItems(n.content,{plain:true})} ${nodeTime(n)}</div>`;
  if(name==="errorOccurred"||name==="postToolUseFailure")return`<div class="error-block"><div class="node-head"><strong>⛔ ${esc(n.title)}</strong>${nodeTime(n)}</div>${contentItems(n.content,{plain:true})}</div>`;
  if(name==="agentStop")return`<div class="agent-stop">↳ <strong>turn complete</strong>${nodeTime(n)}</div>`;
  const body=contentItems(n.content,{plain:true});
  return`<div class="event-line"><span class="event-name">${esc(n.title)}</span> ${nodeTime(n)}${body?`<div class="payload">${body}</div>`:n.raw_payload&&Object.keys(n.raw_payload).length?`<div class="payload">${codeHtml(n.raw_payload)}</div>`:""}</div>`;
}
function eventLabel(p){return p.hook_event_name||"event"}
function eventPayload(p,exclude=[]){const o={};for(const [k,v] of Object.entries(p||{}))if(!exclude.includes(k))o[k]=v;return o}
function payloadBlock(p,exclude=[]){const o=eventPayload(p,exclude);return Object.keys(o).length?content(o):""}
async function fetchJson(url){const r=await fetch(url);if(!r.ok)throw Error(r.status);return r.json()}
function sessionMatches(s){const q=$("search").value.trim().toLowerCase(),status=$("status-filter").value,min=Number($("min-tools").value||0);return(!q||`${s.session_id} ${s.cwd||""}`.toLowerCase().includes(q))&&(status==="all"||s.status===status)&&Number(s.tool_count||0)>=min&&(!$("has-errors").checked||Number(s.error_count||0)>0)}
function sortSessions(a){const mode=$("sort").value;return[...a].sort((x,y)=>mode==="oldest"?x.started_at_ms-y.started_at_ms:mode==="longest"?((y.ended_at_ms??y.last_event_at_ms)-y.started_at_ms)-((x.ended_at_ms??x.last_event_at_ms)-x.started_at_ms):mode==="tools"?y.tool_count-x.tool_count:mode==="errors"?y.error_count-x.error_count:y.started_at_ms-x.started_at_ms)}
function renderSessions(){const list=$("session-list"),shown=sortSessions(sessions.filter(sessionMatches));if(!shown.length){list.innerHTML='<div class="empty">No conversations match these filters.</div>';return}list.innerHTML=shown.map(s=>{const d=(s.ended_at_ms??s.last_event_at_ms)-s.started_at_ms;return`<div class="session-item ${s.session_id===selected?"active":""}" data-sid="${esc(s.session_id)}" role="button" tabindex="0" aria-current="${s.session_id===selected}"><div class="session-top"><span class="dot ${esc(s.status)}"></span><span class="session-id mono" title="${esc(s.session_id)}">${esc(short(s.session_id))}</span><span class="when">${fmtTime(s.started_at_ms)} · ${dur(d)}</span></div><div class="badges"><span class="badge">${s.turn_count||0} turns</span><span class="badge">${s.tool_count||0} tools</span>${s.subagent_count?`<span class="badge">${s.subagent_count} agents</span>`:""}${s.error_count?`<span class="badge err">${s.error_count} errors</span>`:""}<span class="badge">${s.event_count||0} events</span></div></div>`}).join("")}
async function refreshSessions(){try{const [h,d]=await Promise.all([fetchJson("/health"),fetchJson("/api/sessions")]);$("health").classList.toggle("up",h.ok===true);$("refresh-ts").textContent=fmtTime(Date.now());sessions=d.sessions||[];renderSessions()}catch{$("health").classList.remove("up")}}
function spanEventMap(t){const m=new Map((t.events||[]).map(e=>[e.event_id,e]));return m}
function buildModel(t){const events=[...(t.events||[])].sort((a,b)=>timeOf(a)-timeOf(b));const em=spanEventMap(t), spans=(t.spans||[]).filter(s=>s.kind!=="point"&&s.kind!=="session"), points=(t.spans||[]).filter(s=>s.kind==="point");const byId=new Map(),sessionSpan=(t.spans||[]).find(s=>s.kind==="session"),root={id:"root",kind:"session",title:"Session shell",start:sessionSpan?.start_unix_ms??(events[0]?timeOf(events[0]):0),end:sessionSpan?.end_unix_ms,children:[],span:sessionSpan};for(const s of spans){const n={id:s.span_id,kind:s.kind,title:s.kind==="tool"?(s.tool_name||"tool"):s.kind==="subagent"?(s.agent_name||"subagent"):"Turn",start:s.start_unix_ms,end:s.end_unix_ms,span:s,children:[],events:[]};byId.set(s.span_id,n)}for(const s of spans){const n=byId.get(s.span_id);let parent=s.parent_id?byId.get(s.parent_id):root;if(!parent)parent=root;if(n.kind==="tool"||n.kind==="subagent"){const candidate=[...byId.values()].filter(x=>x.kind==="subagent"&&x!==n&&x.start<=n.start&&(x.end==null||n.start<=x.end)&&x.start>=parent.start);if(candidate.length)n.parent=candidate.sort((a,b)=>b.start-a.start)[0]}(n.parent||parent).children.push(n)}for(const p of points){const e=em.get(p.start_event_id);if(!e)continue;let n=p.parent_id&&byId.get(p.parent_id)||root;if(e.payload?.hook_event_name==="permissionRequest"){const name=e.payload.tool_name;const candidate=[...byId.values()].filter(x=>x.kind==="tool"&&(!name||x.title===name)&&x.start<=timeOf(e)&&(x.end==null||timeOf(e)<=x.end)).sort((a,b)=>b.start-a.start)[0];if(candidate)n=candidate}(n.events||(n.events=[])).push(e)}const allUsed=new Set();function mark(n){for(const e of n.events||[])allUsed.add(e.event_id);for(const c of n.children)mark(c)}mark(root);for(const e of events)if(!allUsed.has(e.event_id))root.events.push(e);function sort(n){n.children.sort((a,b)=>a.start-b.start);n.events?.sort((a,b)=>timeOf(a)-timeOf(b));for(const c of n.children)sort(c)}sort(root);root.end??=events.length?timeOf(events[events.length-1]):root.start;return root}
function renderHead(t){const start=t.started_at_ms??0,ev=t.events||[],end=t.ended_at_ms??(ev.length?timeOf(ev[ev.length-1]):start);$("head-sid").textContent=t.session_id;const hs=$("head-status");hs.textContent=t.status||"open";hs.className="status "+(t.status||"open");$("head-range").textContent=`${fmtDate(start)} → ${fmtTime(end)} · ${dur(end-start)}${t.model?` · ${t.model}`:""} · ${t.source||""}`;$("head-cwd").textContent=t.cwd||""}
function usageFooter(t){const u=t.usage;if(!u)return"";const parts=[];if(u.total_nano_aiu!=null)parts.push(`AIU: ${(u.total_nano_aiu/1e9).toFixed(2)}`);if(u.total_premium_requests!=null)parts.push(`premium requests: ${u.total_premium_requests}`);if(u.output_tokens!=null)parts.push(`output tokens: ${u.output_tokens.toLocaleString()}`);if(t.model)parts.push(`model: ${t.model}`);return parts.length?`<div class="usage-footer">${parts.map(p=>`<span>${esc(p)}</span>`).join("")}</div>`:""}
function renderWaterfall(t){const spans=(t.spans||[]).filter(s=>s.kind!=="point");if(!spans.length){$("wf").innerHTML='<span class="muted tiny">No spans</span>';return}const ev=t.events||[],lastEvent=ev.length?Math.max(...ev.map(timeOf)):undefined;const min=Math.min(...spans.map(s=>s.start_unix_ms)),ends=spans.map(s=>s.end_unix_ms).filter(x=>x!=null),clamp=Math.max(...ends,lastEvent??min+1),max=Math.max(min+1,clamp),range=max-min;const pct=x=>((Math.min(x,max)-min)/range*100).toFixed(2);$("wf").innerHTML=spans.map(s=>{const end=Math.min(s.end_unix_ms??max,max);return`<div class="wf-row"><span class="wf-label mono" title="${esc(s.span_id)}">${esc(s.kind)}${s.tool_name?" · "+esc(s.tool_name):""}${s.agent_name?" · "+esc(s.agent_name):""}</span><span class="wf-track"><span class="wf-bar ${s.kind} ${s.status==="error"?"error":""}" style="left:${pct(s.start_unix_ms)}%;width:${Math.max(.3,(end-s.start_unix_ms)/range*100)}%"></span></span><span class="wf-dur">${dur(end-s.start_unix_ms)}</span></div>`}).join("")}
function renderTrace(t){trace=t;codeStore.clear();codeSeq=0;$("placeholder").style.display="none";$("topbar").classList.add("show");$("scroller").classList.add("scroller-show");renderHead(t);renderWaterfall(t);$("feed").innerHTML=renderDocNode(t.root)+usageFooter(t);}
async function selectSession(id){selected=id;lastJson="";renderSessions();await refreshTrace(true)}
async function refreshTrace(force=false){if(!selected)return;try{const t=await fetchJson(`/api/sessions/${encodeURIComponent(selected)}/conversation`),j=JSON.stringify(t);if(!force&&j===lastJson)return;const sc=$("scroller"),pin=sc.scrollHeight-sc.scrollTop-sc.clientHeight<70;lastJson=j;renderTrace(t);if(force||pin)sc.scrollTop=sc.scrollHeight}catch{}}
function transcriptNode(n,level=0){const pad="  ".repeat(level),out=[];if(n.kind==="session")out.push(`${pad}## Session shell`);else if(n.kind==="turn")out.push(`${pad}### Turn (${n.span.status}, ${n.start?fmtDate(n.start):""})`);else if(n.kind==="tool")out.push(`${pad}#### Tool: ${n.title} [${n.span.status}]`);else if(n.kind==="subagent")out.push(`${pad}#### Subagent: ${n.title} [${n.span.status}]`);const items=[...(n.events||[]).map(e=>({t:timeOf(e),text:(()=>{const p=e.payload||{},name=eventLabel(p);if(name==="userPromptSubmitted")return`${pad}**User (${fmtDate(timeOf(e))})**\n\n${verbatimMarkdown(val(p,"prompt","initial_prompt"))}`;if(name==="agentStop")return`${pad}**Agent stop**${p.stop_reason?` · ${p.stop_reason}`:""} (${fmtDate(timeOf(e))})`;return`${pad}- **${name}** · ${fmtDate(timeOf(e))}\n${verbatimMarkdown(eventPayload(p,["hook_event_name","session_id","timestamp"]))}`})()})),...n.children.map(c=>({t:c.start,text:transcriptNode(c,level+1)}))];out.push(...items.sort((a,b)=>a.t-b.t).map(x=>x.text));return out.join("\n\n")}
function verbatimMarkdown(v){if(v===undefined||v===null)return"";if(isRedacted(v))return"`[redacted sha256:"+String(v.sha256||"unknown")+" · "+String(v.bytes??"?")+" B]`";if(typeof v==="string"){return v.includes("\n")?"```\n"+v+"\n```":v}return"```json\n"+JSON.stringify(v,null,2)+"\n```"}
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function copyText(text){try{await navigator.clipboard.writeText(text)}catch{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}}
async function exportConversation(action,button){
  if(!trace)return;
  const sid=trace.session_id;
  try{
    if(action==="pdf"){window.print();return}
    if(action==="json"){
      const conv=await fetchJson(`/api/sessions/${encodeURIComponent(sid)}/conversation`);
      download(`${sid}.conversation.json`,JSON.stringify(conv,null,2),"application/json");
      return;
    }
    if(action==="md"||action==="copy"){
      let md="";
      try{
        const res=await fetch(`/api/sessions/${encodeURIComponent(sid)}/conversation.md`);
        if(!res.ok)throw new Error(String(res.status));
        md=await res.text();
      }catch{
        md=`# Conversation ${sid}\n\n${transcriptNode(buildModel(trace))}\n`;
      }
      if(action==="copy"){
        await copyText(md);
        if(button){const old=button.textContent;button.textContent="Copied";setTimeout(()=>button.textContent=old||"Copy conversation",1000)}
      }else download(`${sid}.md`,md,"text/markdown");
    }
  }catch(err){
    console.error("export failed",err);
  }
}
document.addEventListener("click",async e=>{const item=e.target.closest(".session-item");if(item){selectSession(item.dataset.sid);return}const child=e.target.closest("[data-child-session]");if(child){selectSession(child.dataset.childSession);return}const exp=e.target.closest("[data-export]");if(exp&&trace){await exportConversation(exp.dataset.export,exp);return}const cb=e.target.closest(".collapse");if(cb){cb.classList.toggle("closed");$("wf").classList.toggle("closed");return}const code=e.target.closest("[data-code-action]");if(code){const wrap=code.closest(".code-wrap"),id=wrap.dataset.codeId,raw=codeStore.get(id)||"",action=code.dataset.codeAction;if(action==="copy"){await copyText(raw);const n=wrap.querySelector(".copy-note");n.classList.add("show");setTimeout(()=>n.classList.remove("show"),900)}if(action==="lines")wrap.classList.toggle("no-lines");if(action==="smaller")wrap.style.setProperty("--code-size",Math.max(9,parseFloat(getComputedStyle(wrap).getPropertyValue("--code-size"))-1)+"px");if(action==="larger")wrap.style.setProperty("--code-size",Math.min(20,parseFloat(getComputedStyle(wrap).getPropertyValue("--code-size"))+1)+"px")}})
document.addEventListener("keydown",e=>{const item=e.target.closest(".session-item");if(item&&(e.key==="Enter"||e.key===" ")){e.preventDefault();selectSession(item.dataset.sid)}});
["search","status-filter","sort","min-tools","has-errors"].forEach(id=>$(id).addEventListener("input",renderSessions));
refreshSessions();setInterval(refreshSessions,3000);setInterval(()=>{$("live").checked&&refreshTrace(false)},2000);
</script>
