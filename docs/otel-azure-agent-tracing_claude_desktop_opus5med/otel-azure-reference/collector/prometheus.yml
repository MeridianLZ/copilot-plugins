global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # The Collector's own telemetry. Watch otelcol_processor_dropped_spans and
  # otelcol_exporter_send_failed_spans — those are how you find out you are
  # losing data before someone else does.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
